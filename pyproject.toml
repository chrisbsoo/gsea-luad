[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "romapy"
version = "0.1.3"
description = "An independent Python implementation of ROMA (Representation and Quantification of Module Activity)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Christopher Soo", email = "chris.bsoo2005@gmail.com"}]
keywords = ["bioinformatics", "gene-set-enrichment", "pca", "pathway-analysis", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/romapy"]